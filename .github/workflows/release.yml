name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Buildchain publication channel
        required: true
        default: release
        type: choice
        options:
          - alpha
          - release
      target-ref:
        description: Protected channel ref to promote
        required: true
        default: release/v1/v1.0
        type: string
      target-sha:
        description: Exact reviewed release-candidate SHA
        required: true
        type: string
      alpha-dogfood-sha:
        description: Exact alpha commit with successful three-platform self dogfood (required for stable)
        required: false
        type: string

permissions:
  actions: write
  artifact-metadata: write
  attestations: write
  checks: write
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  alpha-dogfood-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Require three-platform alpha dogfood before stable
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          TARGET_SHA: ${{ inputs.target-sha }}
          ALPHA_DOGFOOD_SHA: ${{ inputs.alpha-dogfood-sha }}
        run: |
          if [ "$CHANNEL" != release ]; then
            echo "Alpha publication creates the candidate consumed by self dogfood."
            exit 0
          fi
          test ${#ALPHA_DOGFOOD_SHA} -eq 40 || {
            echo "Stable publication requires an exact alpha-dogfood-sha" >&2
            exit 1
          }
          state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ALPHA_DOGFOOD_SHA}/status" \
            --jq '.statuses[] | select(.context == "taolu-alpha-dogfood") | .state' | head -n 1)
          test "$state" = success || {
            echo "Stable publication requires successful taolu-alpha-dogfood on $ALPHA_DOGFOOD_SHA" >&2
            exit 1
          }

  promote:
    needs: alpha-dogfood-gate
    uses: kungfu-systems/buildchain/.github/workflows/release-candidate-promote.yml@v4
    with:
      buildchain-channel: ${{ inputs.channel == 'alpha' && 'alpha' || 'stable' }}
      buildchain-ref: ${{ inputs.channel == 'alpha' && 'v4-alpha' || 'v4' }}
      buildchain-contract-lock-path: .buildchain/contract-lock.json
      buildchain-stable-contract-lock-path: .buildchain/contract-lock.json
      buildchain-alpha-contract-lock-path: .buildchain/alpha-contract-lock.json
      allow-repository: kungfu-systems/taolu
      channel: ${{ inputs.channel }}
      target-ref: ${{ inputs.target-ref }}
      target-sha: ${{ inputs.target-sha }}
      package-manager: custom
      artifact-name: taolu
      release-candidate-workflow-file: verify.yml
      release-candidate-workflow-name: Verify
      artifact-patterns: |
        taolu-*
      publish-target: github-release
      github-release: true
      declarative-release-tail: true
      github-release-title: Taolu ${{ inputs.channel }}
      github-release-payload-patterns: |
        taolu-*
      publish-artifact-kind: binary
      release-passport: true
      release-passport-product-name: Taolu
      publication-auto-admission: true
      publication-auto-no-gate: true
      publication-publisher-workflow-path: .github/workflows/release.yml
      publication-product: Taolu
      publication-target: github-release:kungfu-systems/taolu
      publication-package-name: kungfu-systems/taolu
      runner-preset: github-hosted
      trusted-publishing: false
      dry-run: false
    secrets: inherit
