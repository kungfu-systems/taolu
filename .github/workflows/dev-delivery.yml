name: Buildchain Dev Delivery

run-name: "Taolu PR #${{ github.event.client_payload.candidate.pullRequestNumber || inputs.expected-pr-number }} · Buildchain v4 Delivery Warrant"

on:
  workflow_dispatch:
    inputs:
      expected-pr-number:
        description: Exact Taolu pull request number
        type: number
        required: true
      expected-head-sha:
        description: Exact 40-character pull request head
        type: string
        required: true
      source-workflow-run-id:
        description: Exact successful Verify workflow run
        type: number
        required: true
      assignment-root:
        description: Exact native Assignment work-definition root
        type: string
        required: true
      initiative-root:
        description: Exact native Initiative version root
        type: string
        required: true
      source-identity-root:
        description: Immutable source identity root
        type: string
        required: true
      source-patch-root:
        description: Immutable source patch root
        type: string
        required: true
      plan-root:
        description: Exact qualification plan root
        type: string
        required: true
      closure-root:
        description: Exact affected-closure root
        type: string
        required: true
      dependency-root:
        description: Exact dependency graph root
        type: string
        required: true
      toolchain-root:
        description: Exact qualification toolchain root
        type: string
        required: true
      environment-root:
        description: Exact native execution environment root
        type: string
        required: true
      affected-paths-json:
        description: JSON paths covered by native qualification
        type: string
        required: true
  repository_dispatch:
    types: [taolu-dev-delivery-wake]

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read
  statuses: write

jobs:
  deliver:
    uses: kungfu-systems/buildchain/.github/workflows/dev-pr-auto-merge.yml@v4-alpha
    with:
      buildchain-repository: kungfu-systems/buildchain
      buildchain-ref: v4-alpha
      target-branch: dev/v1/v1.0
      expected-pr-number: ${{ github.event.client_payload.candidate.pullRequestNumber || fromJSON(github.event.inputs.expected-pr-number) }}
      expected-head-sha: ${{ github.event.client_payload.candidate.sourceHead || github.event.inputs.expected-head-sha }}
      source-workflow-run-id: ${{ github.event.client_payload.candidate.sourceWorkflowRunId || fromJSON(github.event.inputs.source-workflow-run-id) }}
      handoff-workflow-id: dev-delivery.yml
      source-workflow-id: verify.yml
      delivery-warrant-mode: required
      assignment-root: ${{ github.event.client_payload.candidate.assignmentRoot || github.event.inputs.assignment-root }}
      initiative-root: ${{ github.event.client_payload.candidate.initiativeRoot || github.event.inputs.initiative-root }}
      source-identity-root: ${{ github.event.client_payload.candidate.sourceIdentityRoot || github.event.inputs.source-identity-root }}
      source-patch-root: ${{ github.event.client_payload.candidate.sourcePatchRoot || github.event.inputs.source-patch-root }}
      plan-root: ${{ github.event.client_payload.candidate.planRoot || github.event.inputs.plan-root }}
      closure-root: ${{ github.event.client_payload.candidate.closureRoot || github.event.inputs.closure-root }}
      dependency-root: ${{ github.event.client_payload.candidate.dependencyRoot || github.event.inputs.dependency-root }}
      toolchain-root: ${{ github.event.client_payload.candidate.toolchainRoot || github.event.inputs.toolchain-root }}
      environment-root: ${{ github.event.client_payload.candidate.environmentRoot || github.event.inputs.environment-root }}
      affected-paths-json: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.candidate.affectedPaths) || github.event.inputs.affected-paths-json }}
      native-command: "go test -race ./... && go vet ./..."
      native-heartbeat-seconds: 30
      delivery-class: native-proof-required
      delivery-priority: ordinary
      required-status-checks: |
        stage-capsule / Reconcile exact three-platform evidence
        build / Summarize build contract
      queue-admission-context: Buildchain delivery admission
      active-lease-context: Buildchain delivery lease
      ready-label: ready
      block-labels: blocked,do-not-merge,work-in-progress
      allowed-head-prefixes: feature/,fix/,chore/,docs/,ci/,refactor/
      landing-mode: direct
      merge-method: squash
      dry-run: false
    secrets:
      github-token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
